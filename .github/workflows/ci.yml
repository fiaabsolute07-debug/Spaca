name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          # Public local fixture credentials, same as docs/adr/001-local-runtime.md. Not a secret.
          POSTGRES_PASSWORD: local_dev_only
          POSTGRES_DB: creator_marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_MIGRATION_URL: postgres://postgres:local_dev_only@localhost:5432/creator_marketplace_test
      DATABASE_URL: postgres://app_server:local_dev_only@localhost:5432/creator_marketplace_test
      TEST_DATABASE_URL: postgres://app_server:local_dev_only@localhost:5432/creator_marketplace_test
      PAYMENT_MODE: mock
      LIVE_PAYMENTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json --incremental false
      - name: Release static checks (fee zero, no client mark-paid, dev route guards, example secrets)
        run: pnpm release:check
      - name: Unit and contract tests
        run: pnpm test:unit
      - name: Migrate (blank database) and seed fixtures
        # Migration 0001 creates the app_server role used by the application and tests.
        run: |
          pnpm db:migrate
          pnpm db:migrate
          pnpm db:seed
      - name: DB-backed integration tests (real PostgreSQL, mock payment provider)
        run: pnpm test:integration
      - name: Production build (webpack)
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
        run: pnpm exec next build --webpack
